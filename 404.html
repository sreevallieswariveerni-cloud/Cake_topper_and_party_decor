<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 | PartyPop</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="404.css">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <main class="error-page">

        <!-- Page Controls -->
        <div class="page-controls">
            <button class="page-control" id="darkToggle" aria-label="Toggle dark mode">
                <i data-lucide="moon"></i>
            </button>

            <button class="page-control" id="rtlToggle" aria-label="Toggle RTL">
                <i data-lucide="arrow-left-right"></i>
            </button>
        </div>

        <!-- 404 Content -->
        <section class="error-content">

            <span class="error-label">
                PAGE NOT FOUND
            </span>

            <h1>
                4<span>0</span>4
            </h1>

            <h2>
                Oops! This page seems<br>
                to have disappeared.
            </h2>

            <p>
                The page you're looking for might have been moved,
                renamed, or doesn't exist.
            </p>

            <a href="index.html" class="error-btn">
                Go to Homepage
                <i data-lucide="arrow-up-right"></i>
            </a>

        </section>

    </main>
    
    <script>

    lucide.createIcons();

</script>
<script src="main.js"></script>
<!-- <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script> -->
</body>
</html>
